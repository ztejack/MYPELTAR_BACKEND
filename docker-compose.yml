services:
  mypeltar:
    build: .
    container_name: mypeltar
    image: image_mypeltar
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "80:8000"
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:NsVhIxfavIv1R5FOorD03Lc2+IgOZ9v5WVLIjjIGVKc=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=mypeltar
      - DB_USERNAME=user
      - DB_PASSWORD=mypeltar1922
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
    command: ["php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=8000"]

  db:
    image: mysql:latest
    container_name: mypeltar-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mypeltar
      MYSQL_USER: user
      MYSQL_PASSWORD: mypeltar1922
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: mypeltar_redis_cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
