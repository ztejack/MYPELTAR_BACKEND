testSuites:
  - name: Example Test Suite
    meta:
      id: uts_788f4dce3bb8489ea03095c622e4d924
      created: 1684307470248
      modified: 1684307470248
      sortKey: -1745391763765
    tests:
      - name: Returns 200
        meta:
          id: ut_5f9e0d93a57d4a45ae6728c56f8048c2
          created: 1720365418891
          modified: 1739431702548
          sortKey: -1739431018298
        requestId: req_f0665b4851314ceeb255546c7fa098fb
        code: >-
          // const expect = require('chai').expect;

          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));


          async function testRateLimit() {
            const sendRequest = async () => {
              const response = await insomnia.send();
              return { status: response.status, body: JSON.parse(response.data) };
            };

            // First 3 requests should succeed
            for (let i = 0; i < 50; i++) {
              const response = await sendRequest();
              expect(response.status).to.equal(200);
              if (i < 2) await sleep(100); // Small delay between requests
            }

            // 4th request should fail
            const failedResponse = await sendRequest();
            expect(failedResponse.status).to.equal(429);
            expect(failedResponse.body.message).to.equal('Too many requests');

            // Wait for rate limit to reset
          //   await sleep(60000);

            // Request should succeed again
            const finalResponse = await sendRequest();
            expect(finalResponse.status).to.equal(200);
          }


          testRateLimit();
